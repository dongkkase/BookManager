<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>BookManager</title>
    </head>
    <body>
        <main class="splash" aria-label="BookManager 시작">
            <img class="artwork" src="../portable/splash.png" alt="BookManager">
            <div class="loading">
                <div class="status-row">
                    <span id="status" role="status">북매니저를 준비하고 있습니다</span>
                    <span class="stage" id="stage" aria-hidden="true">1 / 3</span>
                </div>
                <div id="progress" class="track" role="progressbar" aria-label="시작 준비" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1" aria-valuetext="북매니저를 준비하고 있습니다">
                    <div class="fill" id="fill"></div>
                </div>
            </div>
        </main>
    </body>
</html>
